[project]
name = "codehome"
version = "0.1.0"
keywords = ["rlsbl"]
description = "Plugin-based worktree manager and dev tool orchestrator"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "smm-h"}]
dependencies = [
    "bcrypt>=4.0.0",
    "cryptography>=46.0.6",
    "docker>=7.1.0",
    "fastapi>=0.135.2",
    "granian>=2.7.3",
    "mcp>=1.0.0",
    "pyjwt[crypto]>=2.8.0",
    "pywebpush>=2.3.0",
    "sentry-sdk[fastapi]>=2.57.0",
    "slowapi>=0.1.9",
    "structlog>=25.5.0",
    "httpx>=0.28.1",
    "tomli-w>=1.0.0",
    "pyyaml>=6.0",
    "websockets>=13.0",
]

[project.scripts]
codehome = "codehome.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codehome"]
exclude = [
    "**/tests/",
    "test_*.py",
    "src/codehome/serve/static/",
]

[project.urls]
Homepage = "https://codehome.org"
Repository = "https://github.com/smm-h/codehome"
